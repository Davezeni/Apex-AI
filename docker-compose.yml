services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Local, unlimited model fallback (optional but recommended).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  # Sandbox for running generated code (Docker-in-Docker).
  # Multi-language (Node + Python + Go); see sandbox/Dockerfile.
  sandbox:
    build: ./sandbox
    container_name: apex-sandbox
    volumes:
      - ./workspace:/workspace
    profiles:
      - sandbox

volumes:
  ollama_data:

# Apex AI — production compose for a free VM (Oracle Always Free recommended).
# One backend service serves API + WebSocket + the built frontend (single origin).
# Ollama (local unlimited model) and the Docker sandbox are optional profiles.
services:
  app:
    build: .
    container_name: apex-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    depends_on:
      - ollama

  # Local, unlimited model fallback (optional but recommended).
  ollama:
    image: ollama/ollama:latest
    container_name: apex-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  # Sandbox for running generated code (Docker-in-Docker; needs privileged on
  # some hosts). Multi-language (Node + Python + Go).
  sandbox:
    build: ./sandbox
    container_name: apex-sandbox
    restart: unless-stopped
    volumes:
      - ./workspace:/workspace
    profiles:
      - sandbox

volumes:
  ollama_data:
